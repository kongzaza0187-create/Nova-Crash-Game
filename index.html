    <meta property="og:title" content="SUPERNOVA — Multiplier Crash Engine &amp; Seamless Wallet Hub" />
    <meta property="og:description" content="SuperNova — Real-time multiplayer crash game with provably fair verification and live room synchronization." />
    <!-- Preload High-Performance Brand Asset -->
    <link rel="preload" as="image" href="/amb-logo-full.png" fetchpriority="high" />
    <!-- Custom Cyber & High-Tech Typography (Rajdhani, Orbitron, Montserrat, Chakra Petch, Exo 2) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Exo+2:wght@400;600;700;800;900&family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700&family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700;800&family=Russo+One&family=Syne:wght@700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet" />
    <script>
      // Silently disable right-click context menu
      document.addEventListener('contextmenu', function(event) {
        event.preventDefault();
        event.stopPropagation();
      }, true);

      // Silently disable developer shortcut keys
      document.addEventListener('keydown', function(event) {
        // F12 key
        if (event.key === 'F12' || event.keyCode === 123) {
          event.preventDefault();
          event.stopPropagation();
        }

        // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
        if (event.ctrlKey && event.shiftKey && (
          event.key === 'I' || event.key === 'i' || 
          event.key === 'J' || event.key === 'j' || 
          event.key === 'C' || event.key === 'c' || 
          event.keyCode === 73 || event.keyCode === 74 || event.keyCode === 67
        )) {
          event.preventDefault();
          event.stopPropagation();
        }

        // Ctrl+U (View Source)
        if (event.ctrlKey && (event.key === 'U' || event.key === 'u' || event.keyCode === 85)) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
